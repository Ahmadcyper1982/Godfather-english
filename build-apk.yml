name: بناء ملف APK — عرّاب الانجليزي

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:          # زر تشغيل يدوي من صفحة Actions

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: جلب الملفات
        uses: actions/checkout@v4

      - name: تجهيز Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: تجهيز أدوات أندرويد
        uses: android-actions/setup-android@v3

      - name: تجهيز Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: مزامنة ملفات التطبيق مع assets
        run: |
          rm -rf android/app/src/main/assets/www
          mkdir -p android/app/src/main/assets
          cp -r www android/app/src/main/assets/www

      - name: بناء APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: رفع ملف APK
        uses: actions/upload-artifact@v4
        with:
          name: GodfatherEnglish-APK
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
