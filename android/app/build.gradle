plugins { id 'com.android.application' }

android {
    namespace 'com.godfather.english'
    compileSdk 34

    defaultConfig {
        applicationId "com.godfather.english"
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName "2.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug   // توقيع تجريبي ليعمل التثبيت مباشرةً
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.11.0'
}
